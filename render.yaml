# Render Blueprint: one web service (frontend + backend + WebSockets) and one PostgreSQL database.
# Review plan names in the Render dashboard before applying; Render's plan catalogue changes.
services:
  - type: web
    name: uth-online
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1            # game state lives in one process — do not scale horizontally
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: SPOTIFY_CLIENT_ID     # optional: table music (§40). Leave blank to hide it.
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uth-db
          property: connectionString
databases:
  - name: uth-db
    databaseName: uth
